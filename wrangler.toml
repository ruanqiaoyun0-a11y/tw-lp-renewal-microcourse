name = "vipthink-renewal-ai-proxy"
main = "renewal-ai-proxy.worker.js"
compatibility_date = "2024-09-23"

# 部署步骤：
#   1. 复制本目录的 renewal-ai-proxy.worker.js 与 wrangler.toml 到单独目录
#   2. npx wrangler login
#   3. npx wrangler secret put MIMO_API_KEY   （输入 MiMo API Key）
#   4. npx wrangler deploy
#   5. 部署后会得到 https://vipthink-renewal-ai-proxy.<你的子域>.workers.dev
#   6. 前端 ⚙️ 设置里填入该地址即可切换为服务端持钥（更安全）
